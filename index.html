<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>El Museo — Ranking ELO Mus</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #10161f;
    --panel: #1a2330;
    --panel-2: #212c3b;
    --line: #2c3849;
    --ink: #eef1f5;
    --ink-muted: #8a96a6;
    --gold: #e8b64c;
    --gold-dim: #7a6534;
    --teal: #4fa89b;
    --danger: #d97757ee;
    --danger-strong: #e0715a;
    --radius: 10px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--bg);}
  body{
    font-family:'Inter',sans-serif;
    color:var(--ink);
    min-height:100vh;
    padding:0 0 60px 0;
  }
  .wrap{max-width:760px;margin:0 auto;padding:28px 18px 0;}

  header.hero{
    display:flex;
    flex-direction:column;
    gap:4px;
    padding-bottom:22px;
    border-bottom:1px solid var(--line);
    margin-bottom:26px;
  }
  .eyebrow{
    font-size:11px;
    letter-spacing:.16em;
    text-transform:uppercase;
    color:var(--teal);
    font-weight:600;
  }
  h1{
    font-family:'Space Grotesk',sans-serif;
    font-size:32px;
    font-weight:700;
    margin:2px 0 0;
    letter-spacing:-0.01em;
  }
  h1 span{color:var(--gold);}
  .sub{color:var(--ink-muted); font-size:13.5px; margin-top:2px;}

  section{margin-bottom:34px;}
  .section-title{
    font-family:'Space Grotesk',sans-serif;
    font-size:13px;
    letter-spacing:.1em;
    text-transform:uppercase;
    color:var(--ink-muted);
    margin-bottom:12px;
    display:flex;
    align-items:baseline;
    gap:8px;
  }
  .section-title .count{
    color:var(--gold-dim);
    font-family:'Inter',sans-serif;
    text-transform:none;
    letter-spacing:0;
    font-size:12px;
  }

  /* Leaderboard */
  .board{
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:var(--radius);
    overflow:hidden;
  }
  .board-head{
    display:grid;
    grid-template-columns:26px 30px 1fr 46px auto;
    align-items:center;
    gap:10px;
    padding:9px 14px;
    border-bottom:1px solid var(--line);
    font-size:10.5px;
    letter-spacing:.08em;
    text-transform:uppercase;
    color:var(--ink-muted);
    font-weight:600;
  }
  .board-head .h-pct, .board-head .h-elo{text-align:right;}
  .row{
    display:grid;
    grid-template-columns:26px 30px 1fr 46px auto;
    align-items:center;
    gap:10px;
    padding:11px 14px;
    border-bottom:1px solid var(--line);
  }
  .row:last-child{border-bottom:none;}
  .rank{
    font-family:'Space Grotesk',sans-serif;
    font-weight:700;
    font-size:15px;
    color:var(--ink-muted);
    text-align:center;
  }
  .row:nth-child(1) .rank{color:var(--gold);}
  .row:nth-child(2) .rank{color:#c9ccd1;}
  .row:nth-child(3) .rank{color:#b5895a;}
  .avatar{
    width:28px; height:28px;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    font-family:'Space Grotesk',sans-serif;
    font-size:10.5px;
    font-weight:700;
    flex-shrink:0;
  }
  .name{font-weight:600; font-size:14.5px;}
  .record{color:var(--ink-muted); font-size:11.5px; margin-top:1px;}
  .pct{
    font-size:12.5px;
    color:var(--ink-muted);
    text-align:right;
    font-variant-numeric: tabular-nums;
  }
  .elo{
    font-family:'Space Grotesk',sans-serif;
    font-weight:700;
    font-size:19px;
    color:var(--gold);
    min-width:52px;
    text-align:right;
    font-variant-numeric: tabular-nums;
  }
  .empty{
    padding:26px 14px;
    text-align:center;
    color:var(--ink-muted);
    font-size:13.5px;
  }

  /* Pending (below minimum) */
  .pending{
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:4px 14px;
  }
  .pending-row{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:9px 0;
    border-bottom:1px solid var(--line);
    font-size:13.5px;
  }
  .pending-row:last-child{border-bottom:none;}
  .pending-row .pname{font-weight:600;}
  .pending-row .pprog{color:var(--ink-muted); font-variant-numeric:tabular-nums;}

  /* Form */
  form.match-form{
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:16px;
    display:flex;
    flex-direction:column;
    gap:14px;
  }
  .team-block{
    border:1px solid var(--line);
    border-radius:8px;
    padding:12px;
    background:var(--panel-2);
  }
  .team-label{
    font-family:'Space Grotesk',sans-serif;
    font-size:12px;
    font-weight:700;
    letter-spacing:.06em;
    text-transform:uppercase;
    margin-bottom:8px;
  }
  .team-label.a{color:var(--teal);}
  .team-label.b{color:var(--gold);}
  .team-pair{display:flex; gap:8px;}
  .team-pair .field{flex:1; display:flex; flex-direction:column; gap:6px;}
  .vs-divider{
    text-align:center;
    color:var(--ink-muted);
    font-family:'Space Grotesk',sans-serif;
    font-size:12px;
    font-weight:600;
  }
  label{
    display:block;
    font-size:11.5px;
    color:var(--ink-muted);
    margin-bottom:5px;
    letter-spacing:.02em;
  }
  input[type="text"], input[type="date"], select{
    width:100%;
    background:var(--bg);
    border:1px solid var(--line);
    color:var(--ink);
    padding:10px 11px;
    border-radius:7px;
    font-size:14.5px;
    font-family:'Inter',sans-serif;
  }
  select{
    appearance:none;
    -webkit-appearance:none;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='14' height='14' viewBox='0 0 24 24' fill='none' stroke='%238a96a6' stroke-width='2'><polyline points='6 9 12 15 18 9'/></svg>");
    background-repeat:no-repeat;
    background-position:right 10px center;
    padding-right:30px;
  }
  select:invalid{color:var(--ink-muted);}
  input:focus, select:focus{outline:2px solid var(--teal); outline-offset:1px;}
  .winner-row{display:flex; gap:8px;}
  .winner-btn{
    flex:1;
    padding:10px;
    border-radius:7px;
    border:1px solid var(--line);
    background:var(--panel-2);
    color:var(--ink-muted);
    font-size:13.5px;
    font-weight:600;
    cursor:pointer;
    text-align:center;
  }
  .winner-btn.active-a{border-color:var(--teal); color:var(--teal); background:#132321;}
  .winner-btn.active-b{border-color:var(--gold); color:var(--gold); background:#2a2415;}
  .submit-btn{
    margin-top:2px;
    background:var(--teal);
    color:#0d1a18;
    border:none;
    padding:11px;
    border-radius:7px;
    font-weight:700;
    font-size:14px;
    cursor:pointer;
    font-family:'Inter',sans-serif;
  }
  .submit-btn:disabled{opacity:.5; cursor:default;}
  .form-msg{font-size:12.5px; color:var(--danger-strong); min-height:16px;}

function populateSelect(selectEl, names){
  const prev = selectEl.value;
  const opts = ['<option value="">-- Elegir --</option>']
    .concat(names.map(n=>`<option value="${escapeHtml(n)}">${escapeHtml(n)}</option>`))
    .concat([`<option value="${OTHER_VALUE}">Otro (jugador nuevo)</option>`]);
  selectEl.innerHTML = opts.join('');
  // conservar selección previa si el jugador sigue existiendo
  if(prev && [...selectEl.options].some(o=>o.value===prev)){
    selectEl.value = prev;
  }
}

function renderPlayersSelects(names){
  knownPlayers = [...names].sort((a,b)=>a.localeCompare(b,'es'));
  SLOTS.forEach(slot=>{
    populateSelect(document.getElementById(slot+'-select'), knownPlayers);
  });
}

function getSlotValue(slot){
  const select = document.getElementById(slot+'-select');
  const other = document.getElementById(slot+'-other');
  if(select.value === OTHER_VALUE){
    return other.value.trim();
  }
  return select.value.trim();
}

// alternar el input de texto "otro" según el select
SLOTS.forEach(slot=>{
  const select = document.getElementById(slot+'-select');
  const other = document.getElementById(slot+'-other');
  select.addEventListener('change', ()=>{
    if(select.value === OTHER_VALUE){
      other.style.display = 'block';
      other.focus();
    } else {
      other.style.display = 'none';
      other.value = '';
    }
  });
});

function renderBoard(ranked){
  const board = document.getElementById('board');
  document.getElementById('board-count').textContent = ranked.length ? `· ${ranked.length} jugadores` : '';
  if(ranked.length === 0){
    board.innerHTML = `<div class="empty">Nadie llega todavía a las ${MIN_GAMES} partidas mínimas.</div>`;
    return;
  }
  board.innerHTML = ranked.map((p,i)=>{
    const pct = p.played > 0 ? (p.wins / p.played) : 0;
    return `
    <div class="row">
      <div class="rank">${i+1}</div>
      ${avatarHTML(p.name)}
      <div>
        <div class="name">${escapeHtml(p.name)}</div>
        <div class="record">${p.played} partidas · ${p.wins}V ${p.losses}D</div>
      </div>
      <div class="pct">${pct.toFixed(3)}</div>
      <div class="elo">${p.rating}</div>
    </div>
  `;}).join('');
}

function renderPending(pending){
  const section = document.getElementById('pending-section');
  const box = document.getElementById('pending');
  document.getElementById('pending-count').textContent = pending.length ? `· ${pending.length}` : '';
  if(pending.length === 0){ section.style.display = 'none'; return; }
  section.style.display = 'block';
  box.innerHTML = pending.map(p=>`
    <div class="pending-row">
      <span class="pname">${escapeHtml(p.name)}</span>
      <span class="pprog">${p.played}/${MIN_GAMES}</span>
    </div>
  `).join('');
}

function renderHistory(perMatchDelta){
  const container = document.getElementById('history');
  const ordered = [...sortedMatches()].reverse();
  document.getElementById('hist-count').textContent = ordered.length ? `· ${ordered.length} partidas` : '';
  if(ordered.length === 0){
    container.innerHTML = '<div class="empty">Sin partidas todavía.</div>';
    return;
  }
  container.innerHTML = ordered.map(m=>{
    const d = perMatchDelta[m.id] || {deltaA:0, deltaB:0};
    const votes = m.deleteVotes || 0;
    const iVoted = myVotes.includes(m.id);
    const winTeam = m.winner === 'A' ? m.teamA : m.teamB;
    const loseTeam = m.winner === 'A' ? m.teamB : m.teamA;
    const winDelta = m.winner === 'A' ? d.deltaA : d.deltaB;
    const loseDelta = m.winner === 'A' ? d.deltaB : d.deltaA;
    const dots = Array.from({length: VOTES_NEEDED}).map((_,i)=>`<div class="vote-dot ${i < votes ? 'filled' : ''}"></div>`).join('');

    return `
      <div class="hist-item">
        <div class="hist-top">
          <div class="hist-main">
            <div class="hist-date">${formatDate(m.date)}</div>
            <div class="hist-match">
              <span class="win">${escapeHtml(winTeam.join(' y '))}</span> (+${winDelta})
              &nbsp;ganaron a&nbsp;
              <span class="lose">${escapeHtml(loseTeam.join(' y '))}</span> (${loseDelta})
            </div>
          </div>
          <button class="del-btn" data-id="${m.id}" ${iVoted ? 'disabled' : ''}>
            ${iVoted ? `Votado (${votes}/${VOTES_NEEDED})` : `Eliminar (${votes}/${VOTES_NEEDED})`}
          </button>
        </div>
        <div class="vote-dots">${dots}</div>
      </div>
    `;
  }).join('');

  container.querySelectorAll('.del-btn').forEach(btn=>{
    btn.addEventListener('click', async ()=>{
      const id = btn.getAttribute('data-id');
      if(myVotes.includes(id)) return;
      const m = matches.find(x=>x.id === id);
      if(!m) return;
      m.deleteVotes = (m.deleteVotes || 0) + 1;
      myVotes.push(id);

      if(m.deleteVotes >= VOTES_NEEDED){
        matches = matches.filter(x=>x.id !== id);
      }
      const ok = await saveMatches();
      await saveMyVotes();
      if(ok){
        renderAll();
        showToast(m.deleteVotes >= VOTES_NEEDED && !matches.find(x=>x.id===id) ? 'Partida eliminada' : `Voto registrado (${Math.min(m.deleteVotes,VOTES_NEEDED)}/${VOTES_NEEDED})`);
      }
    });
  });
}

function formatDate(iso){
  const [y,m,d] = iso.split('-');
  return `${d}/${m}/${y}`;
}

function escapeHtml(str){
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

function renderAll(){
  const { ranked, pending, perMatchDelta, allNames } = computeStandings();
  renderPlayersSelects(allNames);
  renderBoard(ranked);
  renderPending(pending);
  renderHistory(perMatchDelta);
}

document.getElementById('winA').addEventListener('click', ()=>{
  selectedWinner = 'A';
  document.getElementById('winA').classList.add('active-a');
  document.getElementById('winB').classList.remove('active-b');
});
document.getElementById('winB').addEventListener('click', ()=>{
  selectedWinner = 'B';
  document.getElementById('winB').classList.add('active-b');
  document.getElementById('winA').classList.remove('active-a');
});

document.getElementById('match-form').addEventListener('submit', async (e)=>{
  e.preventDefault();
  const msg = document.getElementById('form-msg');
  msg.textContent = '';
  showDebug(null);

  const a1 = getSlotValue('a1');
  const a2 = getSlotValue('a2');
  const b1 = getSlotValue('b1');
  const b2 = getSlotValue('b2');
  const date = document.getElementById('matchDate').value || todayISO();

  if(!a1 || !a2 || !b1 || !b2){ msg.textContent = 'Rellena los 4 jugadores.'; return; }
  const allNamesLower = [a1,a2,b1,b2].map(n=>n.toLowerCase());
  if(new Set(allNamesLower).size !== 4){ msg.textContent = 'Los 4 jugadores deben ser distintos.'; return; }
  if(!selectedWinner){ msg.textContent = 'Marca qué pareja ha ganado.'; return; }

  const submitBtn = document.getElementById('submit-btn');
  submitBtn.disabled = true;

  const maxSeq = matches.reduce((max,m)=>Math.max(max, m.seq||0), 0);
  const newMatch = {
    id: Date.now().toString(36) + Math.random().toString(36).slice(2,7),
    seq: maxSeq + 1,
    date,
    teamA: [a1, a2],
    teamB: [b1, b2],
    winner: selectedWinner,
    deleteVotes: 0
  };
  matches.push(newMatch);

  const ok = await saveMatches();
  submitBtn.disabled = false;
  if(ok){
    SLOTS.forEach(slot=>{
      document.getElementById(slot+'-select').value = '';
      document.getElementById(slot+'-other').value = '';
      document.getElementById(slot+'-other').style.display = 'none';
    });
    document.getElementById('matchDate').value = todayISO();
    selectedWinner = null;
    document.getElementById('winA').classList.remove('active-a');
    document.getElementById('winB').classList.remove('active-b');
    renderAll();
    showToast('Partida añadida');
  } else {
    matches.pop();
  }
});

(async function init(){
  if(!window.storage){
    showDebug('window.storage no está disponible en este contexto.');
  }
  await loadMatches();
  await loadMyVotes();
  renderAll();
})();
</script>
